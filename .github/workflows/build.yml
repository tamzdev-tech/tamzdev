name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Job ID
        required: false
        type: string

      zip_path:
        description: Path ZIP di repository
        required: false
        type: string

      zip_url:
        description: URL file ZIP
        required: false
        type: string

      app_name:
        description: Nama Aplikasi
        required: false
        default: Android App
        type: string

      user_id:
        description: Telegram Chat ID
        required: false
        type: string

      build_type:
        description: Debug atau Release
        required: false
        default: Debug
        type: choice
        options:
          - Debug
          - Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Download Project ZIP
        env:
          ZIP_URL: ${{ github.event.inputs.zip_url }}
          ZIP_PATH: ${{ github.event.inputs.zip_path }}
        run: |
          set -e

          rm -f project.zip
          rm -rf my_project

          echo "=========================================="
          echo "DOWNLOADING PROJECT"
          echo "=========================================="

          if [ -n "$ZIP_URL" ] && [ "$ZIP_URL" != "null" ]; then
            echo "Downloading from URL..."

            curl \
              -L \
              --fail \
              --retry 3 \
              --retry-delay 2 \
              --connect-timeout 30 \
              "$ZIP_URL" \
              -o project.zip

          elif [ -n "$ZIP_PATH" ] && [ "$ZIP_PATH" != "null" ]; then
            echo "Using ZIP from repository..."

            if [ ! -f "$ZIP_PATH" ]; then
              echo "ERROR: ZIP_PATH tidak ditemukan!"
              exit 1
            fi

            cp "$ZIP_PATH" project.zip

          else
            echo "ERROR: zip_url dan zip_path kosong!"
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "CHECKING FILE"
          echo "=========================================="

          ls -lh project.zip

          echo ""
          echo "File type:"
          file project.zip

          echo ""
          echo "=========================================="
          echo "TESTING ZIP ARCHIVE"
          echo "=========================================="

          # Tampilkan error ZIP secara langsung
          set +e
          unzip -t project.zip
          ZIP_STATUS=$?
          set -e

          echo ""
          echo "ZIP test exit code: $ZIP_STATUS"

          if [ "$ZIP_STATUS" -ne 0 ]; then
            echo ""
            echo "=========================================="
            echo "ERROR: ZIP ARCHIVE RUSAK ATAU TIDAK LENGKAP"
            echo "=========================================="

            echo ""
            echo "File information:"
            file project.zip

            echo ""
            echo "File size:"
            ls -lh project.zip

            echo ""
            echo "ZIP tidak dapat diverifikasi."

            exit 1
          fi

          echo ""
          echo "ZIP VALID!"

      - name: Extract Project
        run: |
          set -e

          echo "=========================================="
          echo "EXTRACTING PROJECT"
          echo "=========================================="

          mkdir -p my_project

          unzip -o project.zip -d my_project

          echo ""
          echo "Extraction selesai."

      - name: Find Android Project
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING GRADLE PROJECT"
          echo "=========================================="

          PROJECT_FILE=$(find my_project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print \
            -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo ""
            echo "ERROR: Project Android Gradle tidak ditemukan!"
            echo "settings.gradle/settings.gradle.kts tidak ditemukan."

            echo ""
            echo "Isi project:"

            find my_project -maxdepth 4 -type f | head -100

            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Project ditemukan:"
          echo "$PROJECT_DIR"

      - name: Check Project
        run: |
          set -e

          echo "=========================================="
          echo "PROJECT INFORMATION"
          echo "=========================================="

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo ""
          ls -la "$PROJECT_DIR"

          echo ""

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: gradlew tidak ditemukan!"
            exit 1
          fi

          echo "gradlew ditemukan."

      - name: Setup Gradle
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "SETTING UP GRADLE"
          echo "=========================================="

          chmod +x gradlew

          ./gradlew --version

      - name: Build APK
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "BUILDING APK"
          echo "=========================================="

          echo "Build type: $BUILD_TYPE"

          ./gradlew clean

          if [ "$BUILD_TYPE" = "Release" ]; then
            echo "Building RELEASE APK..."

            ./gradlew assembleRelease --stacktrace

          else
            echo "Building DEBUG APK..."

            ./gradlew assembleDebug --stacktrace
          fi

          echo ""
          echo "=========================================="
          echo "BUILD SUCCESS"
          echo "=========================================="

      - name: Find APK
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type }}
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING APK"
          echo "=========================================="

          echo ""
          echo "All APK files:"

          find "$PROJECT_DIR" -type f -name "*.apk" -print || true

          if [ "$BUILD_TYPE" = "Release" ]; then

            APK_FILE=$(find "$PROJECT_DIR" \
              -type f \
              -path "*/build/outputs/apk/release/*.apk" \
              ! -name "*unsigned*" \
              -print \
              -quit)

          else

            APK_FILE=$(find "$PROJECT_DIR" \
              -type f \
              -path "*/build/outputs/apk/debug/*.apk" \
              -print \
              -quit)

          fi

          # Jika Release hanya menghasilkan unsigned APK
          if [ -z "$APK_FILE" ]; then

            APK_FILE=$(find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print \
              -quit)

          fi

          if [ -z "$APK_FILE" ]; then
            echo ""
            echo "ERROR: APK tidak ditemukan!"
            exit 1
          fi

          echo ""
          echo "APK ditemukan:"
          echo "$APK_FILE"

          rm -f final.apk

          cp "$APK_FILE" final.apk

          echo ""
          echo "Final APK:"

          ls -lh final.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: final.apk
          retention-days: 3
          if-no-files-found: error

      - name: Send APK to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.user_id }}
          APP_NAME: ${{ github.event.inputs.app_name }}
          BUILD_TYPE: ${{ github.event.inputs.build_type }}
        run: |
          set -e

          echo "=========================================="
          echo "SENDING APK TO TELEGRAM"
          echo "=========================================="

          if [ ! -f "final.apk" ]; then
            echo "ERROR: final.apk tidak ditemukan!"
            exit 1
          fi

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN kosong!"
            exit 1
          fi

          if [ -z "$CHAT_ID" ]; then
            echo "ERROR: CHAT_ID kosong!"
            exit 1
          fi

          echo ""
          echo "APK:"
          ls -lh final.apk

          CAPTION="Build ${BUILD_TYPE} selesai - ${APP_NAME}"

          echo ""
          echo "Uploading APK to Telegram..."

          RESPONSE=$(curl \
            -sS \
            -X POST \
            -F "chat_id=${CHAT_ID}" \
            -F "document=@final.apk" \
            -F "caption=${CAPTION}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument")

          echo ""
          echo "=========================================="
          echo "TELEGRAM RESPONSE"
          echo "=========================================="

          echo "$RESPONSE"

          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo ""
            echo "=========================================="
            echo "SUCCESS"
            echo "=========================================="

            echo "APK berhasil dikirim ke Telegram."
          else
            echo ""
            echo "=========================================="
            echo "FAILED"
            echo "=========================================="

            echo "APK gagal dikirim ke Telegram."
            exit 1
          fi
