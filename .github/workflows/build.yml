name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Job ID
        required: false
        type: string

      zip_path:
        description: Path ZIP di repository
        required: false
        type: string

      zip_url:
        description: URL file ZIP
        required: false
        type: string

      app_name:
        description: Nama Aplikasi
        required: false
        default: Android App
        type: string

      user_id:
        description: Telegram Chat ID
        required: false
        type: string

      build_type:
        description: Debug atau Release
        required: false
        default: Debug
        type: choice
        options:
          - Debug
          - Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Download Project ZIP
        env:
          ZIP_URL: ${{ github.event.inputs.zip_url }}
          ZIP_PATH: ${{ github.event.inputs.zip_path }}
        run: |
          set -e

          rm -f project.zip
          rm -rf my_project

          echo "=========================================="
          echo "DOWNLOADING PROJECT"
          echo "=========================================="

          if [ -n "$ZIP_URL" ]; then
            echo "Downloading from URL..."

            curl -L \
              --fail \
              --retry 3 \
              --connect-timeout 30 \
              "$ZIP_URL" \
              -o project.zip

          elif [ -n "$ZIP_PATH" ]; then
            echo "Using ZIP from repository..."

            if [ ! -f "$ZIP_PATH" ]; then
              echo "ERROR: ZIP file tidak ditemukan!"
              exit 1
            fi

            cp "$ZIP_PATH" project.zip

          else
            echo "ERROR: zip_url dan zip_path kosong!"
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "CHECKING FILE"
          echo "=========================================="

          ls -lh project.zip

          file project.zip

          echo ""
          echo "Testing ZIP..."

          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "ERROR: File bukan ZIP yang valid!"

            echo "Detected type:"
            file project.zip

            exit 1
          fi

          echo "ZIP VALID!"

      - name: Extract Project
        run: |
          set -e

          echo "=========================================="
          echo "EXTRACTING PROJECT"
          echo "=========================================="

          mkdir -p my_project

          unzip -q project.zip -d my_project

          echo "Extraction selesai."

      - name: Find Android Project
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING GRADLE PROJECT"
          echo "=========================================="

          PROJECT_FILE=$(find my_project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print \
            -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: settings.gradle tidak ditemukan!"

            echo ""
            echo "Isi folder:"

            find my_project -maxdepth 3 -type f | head -100

            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project ditemukan:"
          echo "$PROJECT_DIR"

      - name: Check Project
        run: |
          set -e

          echo "=========================================="
          echo "PROJECT INFORMATION"
          echo "=========================================="

          echo "Project directory:"
          echo "$PROJECT_DIR"

          ls -la "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: gradlew tidak ditemukan!"
            exit 1
          fi

      - name: Setup Gradle
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew --version

      - name: Build APK
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "BUILDING APK"
          echo "=========================================="

          echo "Build type: $BUILD_TYPE"

          ./gradlew clean

          if [ "$BUILD_TYPE" = "Release" ]; then
            echo "Building Release APK..."
            ./gradlew assembleRelease
          else
            echo "Building Debug APK..."
            ./gradlew assembleDebug
          fi

          echo "BUILD SUCCESS!"

      - name: Find APK
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type }}
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING APK"
          echo "=========================================="

          if [ "$BUILD_TYPE" = "Release" ]; then

            APK_FILE=$(find "$PROJECT_DIR" \
              -type f \
              -path "*/build/outputs/apk/release/*.apk" \
              ! -name "*unsigned*" \
              -print \
              -quit)

          else

            APK_FILE=$(find "$PROJECT_DIR" \
              -type f \
              -path "*/build/outputs/apk/debug/*.apk" \
              -print \
              -quit)

          fi

          echo "Semua APK yang ditemukan:"

          find "$PROJECT_DIR" -type f -name "*.apk" -print

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK tidak ditemukan!"
            exit 1
          fi

          echo ""
          echo "APK ditemukan:"
          echo "$APK_FILE"

          rm -f final.apk

          cp "$APK_FILE" final.apk

          ls -lh final.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: final.apk
          retention-days: 3
          if-no-files-found: error

      - name: Send APK to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.user_id }}
          APP_NAME: ${{ github.event.inputs.app_name }}
          BUILD_TYPE: ${{ github.event.inputs.build_type }}
        run: |
          set -e

          echo "=========================================="
          echo "SENDING APK TO TELEGRAM"
          echo "=========================================="

          if [ ! -f final.apk ]; then
            echo "ERROR: final.apk tidak ditemukan!"
            exit 1
          fi

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN kosong!"
            exit 1
          fi

          if [ -z "$CHAT_ID" ]; then
            echo "ERROR: CHAT_ID kosong!"
            exit 1
          fi

          echo "APK:"
          ls -lh final.apk

          CAPTION="Build ${BUILD_TYPE} selesai - ${APP_NAME}"

          RESPONSE=$(curl \
            -sS \
            -X POST \
            -F "chat_id=${CHAT_ID}" \
            -F "document=@final.apk" \
            -F "caption=${CAPTION}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument")

          echo ""
          echo "=========================================="
          echo "TELEGRAM RESPONSE"
          echo "=========================================="

          echo "$RESPONSE"

          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "APK berhasil dikirim ke Telegram."
          else
            echo "ERROR: APK gagal dikirim ke Telegram."
            exit 1
          fi
