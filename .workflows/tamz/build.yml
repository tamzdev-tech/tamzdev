name: Build Android APK & Send to Telegram

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID'
        required: true
        type: string

      zip_path:
        description: 'Path to zip file'
        required: false
        type: string

      zip_url:
        description: 'URL file ZIP'
        required: false
        type: string

      app_name:
        description: 'Nama Aplikasi'
        required: false
        default: 'Android App'
        type: string

      user_id:
        description: 'ID Telegram User'
        required: false
        type: string

      build_type:
        description: 'Debug or Release'
        required: false
        default: 'Debug'
        type: string


jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # JAVA
      # ==========================================

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'


      # ==========================================
      # DOWNLOAD PROJECT ZIP
      # ==========================================

      - name: Download & Extract Android Project
        env:
          ZIP_URL: ${{ github.event.inputs.zip_url }}
          ZIP_PATH: ${{ github.event.inputs.zip_path }}
        run: |
          set -e

          echo "=========================================="
          echo "DOWNLOAD ANDROID PROJECT"
          echo "=========================================="

          if [ -n "$ZIP_URL" ] && [ "$ZIP_URL" != "null" ]; then

            echo "Downloading ZIP from URL..."

            curl -fL "$ZIP_URL" -o project.zip

          elif [ -n "$ZIP_PATH" ] && [ "$ZIP_PATH" != "null" ]; then

            echo "Using ZIP from repository..."

            cp "$ZIP_PATH" project.zip

          else

            echo "ERROR: Tidak ada ZIP URL atau ZIP Path!"
            exit 1

          fi


          echo ""
          echo "=========================================="
          echo "EXTRACTING PROJECT"
          echo "=========================================="

          rm -rf my_project
          mkdir -p my_project

          unzip -q project.zip -d my_project


          echo ""
          echo "=========================================="
          echo "SEARCHING GRADLE PROJECT"
          echo "=========================================="

          # Cari settings.gradle atau settings.gradle.kts

          PROJECT_FILE=$(find my_project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then

            echo "ERROR: Project Android Gradle tidak ditemukan!"
            echo "settings.gradle tidak ditemukan."

            exit 1

          fi


          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo ""
          echo "PROJECT DIRECTORY:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > project_path.txt


      # ==========================================
      # SHOW PROJECT STRUCTURE
      # ==========================================

      - name: Check Project Structure
        run: |
          PROJECT_DIR=$(cat project_path.txt)

          echo "=========================================="
          echo "PROJECT STRUCTURE"
          echo "=========================================="

          ls -la "$PROJECT_DIR"

          echo ""
          echo "APP DIRECTORY:"

          ls -la "$PROJECT_DIR/app" || true


      # ==========================================
      # FIX GRADLE PERMISSION
      # ==========================================

      - name: Setup Gradle Permission
        run: |
          PROJECT_DIR=$(cat project_path.txt)

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "SETUP GRADLE"
          echo "=========================================="

          if [ -f "./gradlew" ]; then

            chmod +x gradlew

            echo "gradlew permission granted."

          else

            echo "ERROR: gradlew tidak ditemukan!"
            exit 1

          fi


      # ==========================================
      # SHOW GRADLE VERSION
      # ==========================================

      - name: Check Gradle
        run: |
          PROJECT_DIR=$(cat project_path.txt)

          cd "$PROJECT_DIR"

          ./gradlew --version


      # ==========================================
      # BUILD APK
      # ==========================================

      - name: Build APK
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type }}
        run: |
          set -e

          PROJECT_DIR=$(cat project_path.txt)

          cd "$PROJECT_DIR"

          echo ""
          echo "=========================================="
          echo "BUILDING APK"
          echo "=========================================="

          echo "Build Type: $BUILD_TYPE"

          if [ "$BUILD_TYPE" = "Release" ]; then

            echo "Building RELEASE APK..."

            ./gradlew clean

            ./gradlew assembleRelease

          else

            echo "Building DEBUG APK..."

            ./gradlew clean

            ./gradlew assembleDebug

          fi


      # ==========================================
      # FIND APK
      # ==========================================

      - name: Find APK
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING APK"
          echo "=========================================="

          find my_project -type f -name "*.apk" -print


          BUILD_TYPE="${{ github.event.inputs.build_type }}"

          if [ "$BUILD_TYPE" = "Release" ]; then

            APK_FILE=$(find my_project \
              -type f \
              -path "*/build/outputs/apk/release/*.apk" \
              -print -quit)

          else

            APK_FILE=$(find my_project \
              -type f \
              -path "*/build/outputs/apk/debug/*.apk" \
              -print -quit)

          fi


          if [ -z "$APK_FILE" ]; then

            echo "ERROR: APK tidak ditemukan!"
            exit 1

          fi


          echo ""
          echo "APK FOUND:"
          echo "$APK_FILE"

          cp "$APK_FILE" final.apk

          echo "APK_PATH=final.apk" >> $GITHUB_ENV


      # ==========================================
      # UPLOAD ARTIFACT BACKUP
      # ==========================================

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: final.apk
          if-no-files-found: error


      # ==========================================
      # SEND APK TO TELEGRAM
      # ==========================================

      - name: Send APK to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.user_id }}
          APP_NAME: ${{ github.event.inputs.app_name }}
          BUILD_TYPE: ${{ github.event.inputs.build_type }}
        run: |
          set -e

          echo "=========================================="
          echo "SENDING APK TO TELEGRAM"
          echo "=========================================="


          if [ ! -f "final.apk" ]; then

            echo "ERROR: final.apk tidak ditemukan!"
            exit 1

          fi


          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then

            echo "ERROR: TELEGRAM_BOT_TOKEN belum tersedia!"
            exit 1

          fi


          if [ -z "$CHAT_ID" ]; then

            echo "ERROR: Telegram User ID kosong!"
            exit 1

          fi


          CAPTION="✅ Build ${BUILD_TYPE} Selesai!
          📱 Project: ${APP_NAME}"


          curl -f \
            -F "chat_id=${CHAT_ID}" \
            -F "document=@final.apk" \
            -F "caption=${CAPTION}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"


          echo ""
          echo "=========================================="
          echo "APK BERHASIL DIKIRIM"
          echo "=========================================="
